<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><script src="config.js"></script><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Shelf"><title>My Shelf</title>
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#18202e;--mut:#667085;--acc:#2f4b8f;--gold:#e0a030;--line:#e1e5ee;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b24;--ink:#e8ecf3;--mut:#8b97a8;--acc:#7da2ff;--gold:#f2b84b;--line:#252d3a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:18px 18px 6px;max-width:640px;margin:auto}h1{font:700 34px/1.1 ui-serif,Georgia,serif;margin:0;flex:1;letter-spacing:-.5px}#st{font-size:12px;color:var(--mut)}
button,input,select,textarea{font-family:system-ui,-apple-system,sans-serif}
.ic{border:0;background:none;font-size:26px;color:var(--gold);padding:4px 8px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
#tabs button{border:0;background:none;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:0}#tabs em{font:700 19px ui-serif,Georgia,serif;font-style:normal;line-height:1.3}#tabs .on{color:var(--acc)}
#bn,#inst{margin:8px auto;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 20%,var(--card));font-size:14px;max-width:604px;width:calc(100% - 36px)}
#q,#so{display:block;width:calc(100% - 36px);max-width:604px;margin:8px auto;padding:11px 14px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-size:16px}
#main{padding:0 18px;max-width:640px;margin:auto}
.card{display:flex;gap:14px;background:var(--card);border-radius:14px;padding:12px;margin:12px 0;box-shadow:0 1px 0 var(--line)}
.cv{position:relative;width:56px;height:84px;border-radius:3px 7px 7px 3px;background:hsl(var(--h) 40% 36%);color:#fff;display:grid;place-items:center;font:700 26px ui-serif,Georgia,serif;flex:none;overflow:hidden;box-shadow:inset 5px 0 0 #0003}.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bd{flex:1;min-width:0}.top{display:flex;gap:6px}.ti{flex:1;min-width:0}.ti b{font:700 18px/1.2 ui-serif,Georgia,serif;display:block}small{color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.act span{font-size:13px;color:var(--mut)}
button{font-size:14px;font-weight:600;border:0;background:color-mix(in srgb,var(--acc) 10%,var(--card));color:var(--acc);border-radius:10px;padding:9px 13px}button.pri{background:var(--acc);color:var(--card)}
.empty{text-align:center;color:var(--mut);padding:56px 0}
.goal{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0 0;font-size:14px;color:var(--mut)}.goal b{font:700 22px ui-serif,Georgia,serif;color:var(--ink)}.goal .bar{margin:8px 0 0}
#fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;padding:0;background:var(--acc);color:var(--card);font-size:30px;box-shadow:0 6px 18px #0004;z-index:7}
#toast{position:fixed;left:18px;right:18px;bottom:calc(140px + env(safe-area-inset-bottom));max-width:604px;margin:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;justify-content:space-between;align-items:center;z-index:9}#toast button{background:none;color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.stats div{background:var(--card);border-radius:14px;padding:14px;color:var(--mut);font-size:13px}.stats b{display:block;font:700 30px ui-serif,Georgia,serif;color:var(--ink)}
.chart{display:flex;gap:8px;height:120px;align-items:flex-end;background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}.chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.chart i{width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.panel{display:grid;gap:10px;margin-top:10px}.panel h3{margin:14px 0 0;font:700 20px ui-serif,Georgia,serif}.panel p{margin:0;color:var(--mut);font-size:14px}
dialog{width:100%;max-width:520px;margin:auto auto 0;border:0;border-radius:20px 20px 0 0;background:var(--card);color:var(--ink);padding:18px 18px calc(18px + env(safe-area-inset-bottom))}dialog::backdrop{background:#0008}dialog[open]{animation:up .25s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}
dialog h3{margin:0 0 6px;font:700 22px ui-serif,Georgia,serif}dialog input,dialog select,dialog textarea{width:100%;margin:5px 0;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.sgb{display:block;width:100%;text-align:left;margin:3px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;padding:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.hl{background:var(--card);border-radius:14px;padding:14px 14px 10px;margin:12px 0;border-left:5px solid var(--c)}
.qt{font:italic 19px/1.45 ui-serif,Georgia,serif;margin:0 0 8px}.nt{margin:0 0 6px;color:var(--mut);font-size:14px}.goal .qt{color:var(--ink);font-size:17px;margin:6px 0}
.ph{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:var(--bg);margin:6px 0}.ph.big{max-height:70vh}
#sn{line-height:2.1}.sn{padding:3px 5px;border-radius:6px;background:var(--bg);margin:2px;box-decoration-break:clone}.sn.on{background:var(--gold);color:#1b1b1b}
#cl{display:flex;gap:10px;align-items:center}#cl i{width:30px;height:30px;border-radius:50%;border:3px solid transparent}#cl i.on{border-color:var(--ink)}#hlg{width:auto;flex:none}
#cr{position:relative;touch-action:none;line-height:0;margin:6px 0}.cri{width:100%;display:block;border-radius:10px;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
#sl{position:absolute;border:2px solid var(--gold);background:#f2b84b33;border-radius:4px;pointer-events:none}
.ic2{position:relative;display:block;height:26px}.ic2 sup{position:absolute;top:-3px;left:50%;margin-left:8px;background:var(--acc);color:var(--card);border-radius:8px;font-size:10px;line-height:1;padding:2px 5px;font-weight:700}
.av{width:38px;height:38px;border-radius:50%;background:hsl(var(--h) 45% 40%);color:#fff;display:grid;place-items:center;font:700 17px ui-serif,Georgia,serif;flex:none}.fr{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px}.fr b{flex:1}.in{width:100%;padding:11px;border:0;border-radius:10px;background:var(--card);color:var(--ink);font-size:16px;min-width:0}.feed small{display:block}
</style></head><body>
<header><h1 id="h1">My Shelf</h1><span id="st"></span><button class="ic" id="fvb" aria-label="Favorites only">♡</button></header>
<nav id="tabs"></nav><div id="bn" hidden></div><div id="inst" hidden>Install it: tap Share, then Add to Home Screen. Safari can erase data of unused browser tabs after about 7 days; installed apps are exempt.</div>
<input id="q" type="search" placeholder="Search title or author"><select id="so"><option value="r">Sort: recent</option><option value="t">Sort: title</option><option value="a">Sort: author</option><option value="s">Sort: rating</option></select><main id="main"></main>
<div id="toast" hidden></div><button id="fab" aria-label="Add book">+</button><dialog id="dlg"></dialog><input id="file" type="file" accept=".json,application/json" hidden><input id="csv" type="file" accept=".csv,text/csv" hidden>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=(d=new Date())=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ago=t=>{const d=Math.floor((Date.now()-t)/864e5);return d?d+'d ago':'today'},note=m=>$('#st').textContent=m;
let dbp;const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('myshelf',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=async(m,f)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('kv',m),q=f(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const dbGet=k=>tx('readonly',o=>o.get(k)),dbSet=(k,v)=>tx('readwrite',o=>o.put(v,k)),dbKeys=()=>tx('readonly',o=>o.getAllKeys());
let S,tab='reading',q='',tm,so='r',fv=false;const SORT={r:(a,b)=>b.u-a.u,t:(a,b)=>a.t.localeCompare(b.t),a:(a,b)=>a.a.localeCompare(b.a),s:(a,b)=>b.r-a.r};
const SV=p=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={reading:SV('<path d="M4 5.5c2.5-1.5 5.5-1.5 8 0v14c-2.5-1.5-5.5-1.5-8 0z"/><path d="M20 5.5c-2.5-1.5-5.5-1.5-8 0v14c2.5-1.5 5.5-1.5 8 0z"/>'),want:SV('<path d="M7 4h10v16l-5-4-5 4z"/>'),done:SV('<circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>'),hl:SV('<path d="M5 18l4-1 9-9-3-3-9 9z"/><path d="M4 21h16"/>'),friends:SV('<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.3 4 4"/>'),stats:SV('<path d="M6 20v-9M12 20V5M18 20v-6"/>'),backup:SV('<path d="M12 16V5M7.5 9.5L12 5l4.5 4.5"/><path d="M5 15v4h14v-4"/>')};
const cnt=k=>{const n=k=='hl'?(S.hl||[]).length:['reading','want','done'].includes(k)?S.books.filter(b=>b.st==k).length:0;return n?`<sup>${n}</sup>`:''};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const hn=b=>{const n=(S.hl||[]).filter(h=>h.b==b.id).length;return n?`<button data-a="bkq">${n} quote${n>1?'s':''}</button>`:''};
const TABS=[['reading','Reading'],['want','Want'],['done','Done'],['hl','Quotes'],['friends','Friends'],['stats','Stats'],['backup','Me']];
async function load(){let a,b;try{a=await dbGet('main')}catch{}try{b=JSON.parse(localStorage.getItem('ms'))}catch{}
 S=[a,b].filter(x=>x&&Array.isArray(x.books)).sort((x,y)=>y.u-x.u)[0]||{books:[],goal:12,lb:0,ch:0,u:0}}
function save(now){S.u=Date.now();S.ch++;clearTimeout(tm);if(now)persist();else tm=setTimeout(persist,400);render()}
async function persist(){clearTimeout(tm);try{localStorage.setItem('ms',JSON.stringify(S))}catch{}
 try{await dbSet('main',S);note('Saved ✓');cloudSoon()}catch{note('⚠ Save failed: back up now')}}
const pct=b=>b.p?Math.min(100,Math.round(b.cur/b.p*100)):0;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const cvr=b=>`<div class="cv" style="--h:${hue(b.t)}"><span>${esc((b.t[0]||'?').toUpperCase())}</span>${b.cv?`<img loading="lazy" alt="" src="${esc(b.cv)}" onerror="this.remove()">`:''}</div>`;
const card=b=>`<article class="card" data-id="${b.id}">${cvr(b)}<div class="bd"><div class="top"><div data-a="edit" class="ti"><b>${esc(b.t)}</b><small>${esc(b.a)}${b.r?' · '+'★'.repeat(b.r):''}</small></div><button class="ic" data-a="fav" aria-label="Favorite">${b.fav?'♥':'♡'}</button></div>`+
(b.st=='reading'?`<div class="bar"><i style="width:${pct(b)}%"></i></div><div class="act"><span>${b.cur}${b.p?' / '+b.p+' pages · '+pct(b)+'%':' pages'}</span></div><div class="act"><button data-a="add" data-n="10">+10</button><button data-a="add" data-n="25">+25</button>${S.tm&&S.tm.id==b.id?`<button class="pri" data-a="tstop"><span class="tk">${fmt(Math.floor((Date.now()-S.tm.t)/1000))}</span> Stop</button>`:`<button data-a="tstart">Timer</button>`}<button data-a="log">Log</button><button class="pri" data-a="done">Finish</button></div>`:
b.st=='want'?`<div class="act"><button class="pri" data-a="start">Start reading</button></div>`:`<small>Finished ${esc(b.fin||'')}</small>`)+`<div class="act"><button data-a="bkhl">+ Highlight</button>${hn(b)}${me?'<button data-a="bkrec">Send to friend</button>':''}</div></div></article>`;
const rq=()=>{const H=S.hl||[];if(!H.length)return '';const h=H[+day().replace(/-/g,'')%H.length];return `<div class="goal"><small>Today's highlight</small><p class="qt" dir="auto">${esc(h.t)}</p><small>${esc(bt(h.b))}</small></div>`};const goal=()=>{const td=day(),pt=S.books.flatMap(b=>b.log).filter(x=>x[0]==td).reduce((s,x)=>s+x[1],0),dg=S.dg||20;return `<div class="goal" data-a="dgoal"><b>${pt}</b> of ${dg} pages today<div class="bar"><i style="width:${Math.min(100,pt/dg*100)}%"></i></div></div>`};
function render(){
 $('#tabs').innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" class="${k==tab?'on':''}"><span class="ic2">${IC[k]}${cnt(k)}</span>${n}</button>`).join('');
 const old=!S.lb||Date.now()-S.lb>6048e5||S.ch>=25;$('#bn').hidden=!(S.books.length&&old&&tab!='backup');
 $('#bn').innerHTML=`${S.lb?'Last backup '+ago(S.lb):'No backup yet'}. <button data-a="bk">Back up now</button>`;
 const isL=['reading','want','done','fav'].includes(tab);$('#q').hidden=!(isL||tab=='hl');$('#so').hidden=$('#fvb').hidden=!isL;$('#fvb').textContent=fv?'♥':'♡';$('#h1').textContent=TABS.find(t=>t[0]==tab)[1];const m=$('#main');
 if(tab=='friends')m.innerHTML=friendsView();else if(tab=='hl')m.innerHTML=hlList();else if(tab=='stats')m.innerHTML=stats();else if(tab=='backup'){m.innerHTML=backup();snaps()}
 else{let L=S.books.filter(b=>b.st==tab&&(!fv||b.fav));if(q)L=L.filter(b=>(b.t+' '+b.a).toLowerCase().includes(q));L.sort(SORT[so]);
  m.innerHTML=(tab=='reading'?goal()+rq():'')+(L.map(card).join('')||`<p class="empty">${fv?'No favorites here yet.':'Nothing here yet. Tap + to add a book.'}</p>`)}}
function pages(b,n){if(b.p)n=Math.min(n,b.p-b.cur);if(n<=0)return;b.cur+=n;const d=day(),l=b.log.find(x=>x[0]==d);l?l[1]+=n:b.log.push([d,n]);b.u=Date.now();if(b.p&&b.cur>=b.p)finish(b);else save()}
function finish(b){if(b.p&&b.cur<b.p)return pages(b,b.p-b.cur);b.st='done';b.fin=day();b.u=Date.now();save();edit(b)}
function edit(b){const n=!b;b=b||{id:uid(),t:'',a:'',p:0,cur:0,st:'want',r:0,n:'',log:[],fav:false,u:0};
 const o=(v,l,c)=>`<option value="${v}" ${v==c?'selected':''}>${l}</option>`;
 $('#dlg').innerHTML=`<h3>${n?'Add book':'Edit book'}</h3><input id="ft" placeholder="Title" value="${esc(b.t)}"><div id="sg"></div><input id="fa" placeholder="Author" value="${esc(b.a)}"><div class="g"><input id="fp" type="number" inputmode="numeric" min="0" placeholder="Total pages" value="${b.p||''}"><input id="fc" type="number" inputmode="numeric" min="0" placeholder="Current page" value="${b.cur||''}"></div><div class="g"><select id="fs">${o('want','Want to read',b.st)+o('reading','Reading',b.st)+o('done','Finished',b.st)}</select><select id="fr">${[0,1,2,3,4,5].map(i=>o(i,i?'★'.repeat(i):'No rating',b.r)).join('')}</select></div><textarea id="fn" rows="3" placeholder="Notes">${esc(b.n)}</textarea><div class="row"><button id="no">Cancel</button>${n?'':'<button id="rm">Delete</button>'}<button class="pri" id="ok">Save</button></div>`;
 let tmr;$('#ft').oninput=e=>{clearTimeout(tmr);const v=e.target.value.trim();if(v.length<3||!n){$('#sg').innerHTML='';return}tmr=setTimeout(async()=>{try{const r=(await(await fetch('https://openlibrary.org/search.json?limit=5&fields=title,author_name,number_of_pages_median,cover_i&q='+encodeURIComponent(v))).json()).docs;$('#sg').innerHTML=r.map((d,i)=>`<button class="sgb" data-i="${i}">${esc(d.title)} <small>${esc((d.author_name||[])[0]||'')}</small></button>`).join('');$('#sg').onclick=ev=>{const x=ev.target.closest('[data-i]');if(!x)return;const d=r[x.dataset.i];$('#ft').value=d.title;$('#fa').value=(d.author_name||[])[0]||'';$('#fp').value=d.number_of_pages_median||'';b.cv=d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':'';$('#sg').innerHTML=''}}catch{}},350)};
 $('#ok').onclick=()=>{const t=$('#ft').value.trim();if(!t)return $('#ft').focus();
  Object.assign(b,{t,a:$('#fa').value.trim(),p:+$('#fp').value||0,cur:+$('#fc').value||0,st:$('#fs').value,r:+$('#fr').value,n:$('#fn').value,u:Date.now()});
  if(b.st=='done'){b.fin=b.fin||day();if(b.p)b.cur=b.p}if(n)S.books.push(b);$('#dlg').close();save()};
 $('#no').onclick=()=>$('#dlg').close();
 if(!n)$('#rm').onclick=()=>{S.books=S.books.filter(x=>x!==b);(S.del=S.del||{})[b.id]=Date.now();$('#dlg').close();save();toast('Book deleted',()=>{S.books.push(b);delete S.del[b.id];b.u=Date.now();save()})};
 $('#dlg').showModal()}
function stats(){const y=day().slice(0,4),B=S.books,yr=B.filter(b=>b.st=='done'&&(b.fin||'').startsWith(y)).length,L=B.flatMap(b=>b.log),tot=L.reduce((s,x)=>s+x[1],0),by={};L.forEach(([d,n])=>by[d]=(by[d]||0)+n);
 const ss=B.flatMap(b=>b.ses||[]),ts=ss.reduce((a,x)=>a+x[1],0),sp=ss.filter(x=>x[2]),pp=sp.reduce((a,x)=>a+x[2],0),ph=sp.reduce((a,x)=>a+x[1],0),rs=B.filter(b=>b.r),ar=rs.length?(rs.reduce((s,b)=>s+b.r,0)/rs.length).toFixed(1):'–';let s=0,d=new Date();if(!by[day(d)])d.setDate(d.getDate()-1);while(by[day(d)]){s++;d.setDate(d.getDate()-1)}
 const w=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[day(d).slice(8),by[day(d)]||0]}),mx=Math.max(1,...w.map(x=>x[1]));
 return `<div class="stats"><div><b>${yr} / ${S.goal}</b>books finished in ${y}</div><div><b>${s}</b>day streak</div><div><b>${tot}</b>pages logged</div><div><b>${B.length}</b>books on shelf</div><div><b>${ar}</b>average rating</div><div><b>${Object.keys(by).length?Math.round(tot/Object.keys(by).length):0}</b>pages per reading day</div><div><b>${Math.floor(ts/3600)}h ${Math.floor(ts%3600/60)}m</b>time read</div><div><b>${ph?Math.round(pp/(ph/3600)):'–'}</b>pages per hour</div><div><b>${(S.hl||[]).length}</b>highlights</div><div><b>${B.filter(b=>b.fav).length}</b>favorites</div></div><div class="chart">${w.map(([l,n])=>`<div title="${n} pages"><i style="height:${n/mx*100}%"></i><small>${l}</small></div>`).join('')}</div><button data-a="goal">Set yearly goal</button>`}
