<meta name="theme-color" content="#1F6F5C">
<style>
:root{--bg:#EEF1EE;--card:#FFFFFF;--ink:#14221E;--mute:#5E6F69;--line:#D5DDD8;--acc:#1F6F5C;--onacc:#FFFFFF;--gold:#C9962B;--heart:#C2413B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1614;--card:#17221F;--ink:#E7EFEB;--mute:#93A59E;--line:#27352F;--acc:#4FB79B;--onacc:#06231B;--gold:#E0B04A;--heart:#E5716A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1614;--card:#17221F;--ink:#E7EFEB;--mute:#93A59E;--line:#27352F;--acc:#4FB79B;--onacc:#06231B;--gold:#E0B04A;--heart:#E5716A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,.serif{font-family:"New York",Georgia,"Times New Roman",serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:14px 16px 10px}
h1{font-size:30px;margin:0 0 10px;letter-spacing:-.3px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
main{padding:4px 16px;max-width:640px;margin:0 auto}
.book{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.cover{flex:0 0 58px;height:84px;border-radius:4px 8px 8px 4px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 26px "New York",Georgia,serif;box-shadow:inset 5px 0 0 rgba(0,0,0,.18)}
.info{flex:1;min-width:0}
.title{font:600 18px/1.2 "New York",Georgia,serif;margin:0}
.by{color:var(--mute);font-size:14px;margin:2px 0 6px}
.stars{color:var(--gold);letter-spacing:1px;font-size:15px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--acc)}
.small{font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.pill{border:1px solid var(--acc);color:var(--acc);background:none;border-radius:999px;padding:5px 12px;font-size:14px}
.heart{margin-left:auto;background:none;border:0;font-size:24px;color:var(--mute);padding:0 4px}
.heart.on{color:var(--heart)}
.empty{text-align:center;color:var(--mute);padding:48px 24px}
.empty b{display:block;color:var(--ink);font:600 20px "New York",Georgia,serif;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;color:var(--mute);font-size:12px}
nav button span{display:block;font-size:22px;line-height:1.1}
nav button.on{color:var(--acc);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:30px;z-index:7;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:21;max-width:640px;margin:0 auto}
.sheet h2{margin:0 0 12px;font-size:24px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--ink)}
.rate button{background:none;border:0;font-size:30px;color:var(--line);padding:0 2px}
.rate button.on{color:var(--gold)}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:12px;padding:13px;width:100%;font-weight:600;margin-top:16px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn.del{background:none;color:var(--heart);border:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font:600 30px "New York",Georgia,serif}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top h1{margin:0}
.tg{background:var(--card);border:1px solid var(--line);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:18px}
.srow{display:flex;gap:8px}.srow select{width:auto;max-width:120px}
.book{box-shadow:0 1px 3px rgba(0,0,0,.07);transition:transform .15s;animation:up .28s both}.book:active{transform:scale(.985)}
.cover{box-shadow:inset 5px 0 0 rgba(0,0,0,.18),2px 3px 8px rgba(0,0,0,.25)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.sheet{animation:slide .25s ease-out}@keyframes slide{from{transform:translateY(40px);opacity:0}}
.sug{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:6px;cursor:pointer}.sug:active{background:var(--line)}
#rd{position:fixed;inset:0;background:var(--bg);z-index:30;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.rc{flex:1;overflow:auto;padding:18px 22px 60px;white-space:pre-wrap;line-height:1.75;font-family:"New York",Georgia,serif;max-width:680px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
#rd{color:var(--ink)}#rd.sepia{background:#F4ECD8;color:#3B2F1E}#rd.sepia .rbar{border-color:#d8c9a6}#rd.black{background:#000;color:#cfcfcf}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
</style>

</head>
<body>
<header><div class="top"><h1 id="h">Reading now</h1><span><button class="tg" onclick="setLang()" aria-label="Language">🌐</button> <button class="tg" onclick="toggleTheme()" aria-label="Switch theme">◐</button></span></div><div class="srow" id="sr"><input class="search" id="q" placeholder="Search title, author or genre" oninput="render()"><select id="so" onchange="sort=this.value;render()"><option value="new">Newest</option><option value="title">A–Z</option><option value="rate">Top rated</option></select></div></header>
<main id="main"></main>
<button class="fab" onclick="openSheet()" aria-label="Add book">+</button>
<nav id="nav"></nav>
<div id="rd" style="display:none"></div><div class="ov" id="wl"></div><div class="ov" id="lk"></div><div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" style="display:none"></div>
<script>
var COLORS=['#1F6F5C','#2F5D9E','#8A3B5C','#B5651D','#5B4B8A','#3A3F47','#A23B3B','#4F7A28'];
var TABS=[['reading','📖','Reading'],['want','🔖','Want'],['done','✅','Finished'],['fav','♥','Favorites'],['stats','📊','Stats']];
var NAMES={reading:'Reading now',want:'Want to read',done:'Finished',fav:'Favorites',stats:'My year'};
var tab='reading',books=[],goal=12,editing=null,draft=null,log={},sort='new',theme='';
try{books=JSON.parse(localStorage.getItem('shelf.books')||'[]');goal=+localStorage.getItem('shelf.goal')||12;log=JSON.parse(localStorage.getItem('shelf.log')||'{}');theme=localStorage.getItem('shelf.theme')||''}catch(e){}
applyTheme();
function idb(cb){try{var r=indexedDB.open('shelf',2);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('files'))d.createObjectStore('files')};r.onsuccess=function(){cb(r.result)};r.onerror=function(){}}catch(e){}}
function save(){var s=JSON.stringify({books:books,goal:goal,log:log});try{localStorage.setItem('shelf.books',JSON.stringify(books));localStorage.setItem('shelf.goal',goal);localStorage.setItem('shelf.log',JSON.stringify(log))}catch(e){}idb(function(db){try{var st=db.transaction('kv','readwrite').objectStore('kv');st.put(s,'data');var g=st.get('snaps');g.onsuccess=function(){var a=g.result||[];if(!a.length||Date.now()-a[0].t>36e5){a.unshift({t:Date.now(),d:s});st.put(a.slice(0,6),'snaps')}}}catch(e){}});try{if(!localStorage.getItem('shelf.first'))localStorage.setItem('shelf.first',Date.now())}catch(e){}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if(!books.length)idb(function(db){try{var g=db.transaction('kv').objectStore('kv').get('data');g.onsuccess=function(){if(g.result){var d=JSON.parse(g.result);if(d.books&&d.books.length){books=d.books;goal=d.goal||12;log=d.log||{};render()}}}}catch(e){}});
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function stars(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):''}
function go(t){tab=t;document.getElementById('q').value='';render();window.scrollTo(0,0)}
function render(){render0();T()}
function render0(){
  document.getElementById('h').textContent=NAMES[tab];
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]==tab?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
  var q=document.getElementById('q');document.getElementById('sr').style.display=tab=='stats'?'none':'flex';
  var m=document.getElementById('main');
  if(tab=='stats'){m.innerHTML=statsHTML();loadSnaps();return}
  var term=q.value.toLowerCase();
  var list=books.filter(function(b){return(tab=='fav'?b.fav:b.shelf==tab)&&(b.title+' '+b.author+' '+(b.genre||'')+' '+(b.tags||'')).toLowerCase().indexOf(term)>-1&&(!tagf||tagsOf(b).indexOf(tagf)>-1)}).sort(function(a,b){return (tab=='want'&&(!!b.next-!!a.next))||(sort=='title'?a.title.localeCompare(b.title):sort=='rate'?(b.rating||0)-(a.rating||0):b.added-a.added)});
  if(!list.length){
    var msg={reading:['Nothing in progress','Tap + to add the book you’re reading.'],want:['Your wish list is empty','Add books you want to read next.'],done:['No finished books yet','Books you finish will show up here.'],fav:['No favorites yet','Tap the heart on any book to keep it here.']}[tab];
    m.innerHTML=dash()+tagRow()+'<div class="empty"><b>'+(term?'No matches':msg[0])+'</b>'+(term?'Try a different search.':msg[1])+'</div>';return}
  m.innerHTML=dash()+tagRow()+list.map(card).join('');
}
function card(b){
  var pct=b.pages?Math.min(100,Math.round(b.page/b.pages*100)):0,x='';
  if(b.shelf=='reading'){x='<div class="bar"><i style="width:'+pct+'%"></i></div><div class="small">'+(b.pages?'Page '+(b.page||0)+' of '+b.pages+' · '+pct+'%':'Page '+(b.page||0))+'</div><div class="row"><button class="pill" onclick="bump(\''+b.id+'\',10)">+10 pages</button><button class="pill" onclick="mv(\''+b.id+'\',\'done\')">Finished</button></div>'}
  if(b.shelf=='want')x='<div class="row"><button class="pill" onclick="mv(\''+b.id+'\',\'reading\')">Start reading</button></div>';
  if(b.shelf=='done')x='<div class="stars">'+stars(b.rating)+'</div>'+(b.finished?'<div class="small">Finished '+esc(b.finished)+'</div>':'');
  return '<div class="book"><div class="cover" style="background:'+bg(b)+'" onclick="openSheet(\''+b.id+'\')">'+(b.img?'':esc(b.title.charAt(0).toUpperCase()))+'</div><div class="info"><div onclick="openSheet(\''+b.id+'\')"><p class="title" dir="auto">'+(b.next&&b.shelf=='want'?'⭐ ':'')+esc(b.title)+'</p><p class="by" dir="auto">'+esc(b.author||'Unknown author')+(b.genre?' · '+esc(b.genre):'')+(b.lent?' · 📤 Lent to '+esc(b.lent):'')+(b.tags?' · 🏷 '+esc(b.tags):'')+'</p></div>'+x+(b.file?'<div class="row"><button class="pill" onclick="readBook(this.dataset.id)" data-id="'+b.id+'">📖 Read book</button></div>':'')+'</div><button class="heart '+(b.fav?'on':'')+'" onclick="fav(\''+b.id+'\')" aria-label="Favorite">'+(b.fav?'♥':'♡')+'</button></div>';
}
function find(id){return books.filter(function(b){return b.id==id})[0]}
function fav(id){var b=find(id);b.fav=!b.fav;save();render()}
function bump(id,n){var b=find(id),o=b.page||0;b.page=o+n;if(b.pages&&b.page>=b.pages)b.page=b.pages;var d=b.page-o;if(d>0){var k=today();log[k]=(log[k]||0)+d}save();render()}
function mv(id,s){var b=find(id);b.shelf=s;if(s=='done'){b.finished=new Date().toISOString().slice(0,10);if(b.pages)b.page=b.pages}save();if(s=='done')openSheet(id);else{tab=s;render()}}
function openSheet(id){openSheet0(id);T(document.getElementById('sheet'))}
function openSheet0(id){
  editing=id||null;
  var b=id?find(id):{title:'',author:'',shelf:tab=='want'||tab=='done'?tab:'reading',pages:'',page:'',rating:0,notes:'',color:COLORS[books.length%COLORS.length],fav:tab=='fav'};
  draft=JSON.parse(JSON.stringify(b));
  var s=document.getElementById('sheet');
  s.innerHTML='<h2>'+(id?'Edit book':'Add a book')+'</h2>'+
  '<label>Title</label><input id="f_title" dir="auto" oninput="suggest(this.value)" value="'+esc(b.title)+'"><div id="f_sug"></div>'+
  '<label>Author</label><input id="f_author" dir="auto" value="'+esc(b.author)+'">'+
  '<label>Shelf</label><select id="f_shelf"><option value="reading">Reading now</option><option value="want">Want to read</option><option value="done">Finished</option></select>'+
  '<label>Genre</label><input id="f_genre" placeholder="Fantasy, History, Poetry…" value="'+esc(b.genre)+'">'+
  '<label>Lent to (optional)</label><input id="f_lent" dir="auto" value="'+esc(b.lent)+'">'+
  '<label>Lists or series (comma-separated)</label><input id="f_tags" dir="auto" placeholder="Summer reading, Harry Potter" value="'+esc(b.tags)+'">'+
  '<label>Read this next?</label><select id="f_next"><option value="">No</option><option value="1">Yes ⭐</option></select>'+
  '<div class="two"><div><label>Total pages</label><input id="f_pages" type="number" inputmode="numeric" value="'+esc(b.pages)+'"></div><div><label>Current page</label><input id="f_page" type="number" inputmode="numeric" value="'+esc(b.page)+'"></div></div>'+
  '<label>Rating</label><div class="rate" id="f_rate"></div>'+
  '<label>Cover color</label><div class="swatches" id="f_sw"></div>'+
  '<label>Cover photo</label><div class="row" style="margin-top:0"><button class="pill" onclick="f_img.click()">🖼 Gallery</button><button class="pill" onclick="f_cam.click()">📷 Camera</button><button class="pill" onclick="draft.img=null;pv()">Remove</button><span class="small" id="f_pv">'+(b.img?'Photo added ✓':'')+'</span><input type="file" id="f_img" accept="image/*" style="display:none" onchange="pickImg(this)"><input type="file" id="f_cam" accept="image/*" capture="environment" style="display:none" onchange="pickImg(this)"></div><label>Book file (PDF or .txt, stays on this phone)</label><div class="row" style="margin-top:0"><button class="pill" onclick="f_bk.click()">📎 Attach book</button><button class="pill" onclick="draftFile=null;rmFile=true;fv()">Remove</button><span class="small" id="f_fn"></span><input type="file" id="f_bk" accept=".pdf,.txt,.epub,application/pdf,text/plain,application/epub+zip" style="display:none" onchange="pickBk(this)"></div><label>Notes and favorite quotes</label><textarea id="f_notes" dir="auto">'+esc(b.notes)+'</textarea>'+
  '<button class="btn" onclick="saveBook()">Save</button><button class="btn ghost" onclick="closeSheet()">Cancel</button>'+(id?'<button class="btn ghost" onclick="shareBook()">Share this book</button>':'')+(id?'<button class="btn del" onclick="delBook()">Delete book</button>':'');
